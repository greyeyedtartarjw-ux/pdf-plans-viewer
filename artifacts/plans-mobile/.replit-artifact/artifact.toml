kind = "mobile"
previewPath = "/plans-mobile/"
title = "Plans Mobile"
description = "A mobile companion app for PDF Plans Viewer that lets field workers and contractors open PDF construction plans, tap to measure distances and polygon areas on-site, and sync measurements to the shared API server."
version = "1.0.0"
id = "artifacts/plans-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/plans-mobile/" ]
localPort = 20483

[services.development]
run = "pnpm --filter @workspace/plans-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/plans-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/plans-mobile", "run", "serve" ]

[services.env]
PORT = "20483"
BASE_PATH = "/plans-mobile/"
